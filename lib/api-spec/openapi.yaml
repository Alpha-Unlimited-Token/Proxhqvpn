components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Node:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        layer:
          type: string
          enum: [outer, inner]
        hopIndex:
          type: integer
          description: Position in the chain (1-50 for outer, 1-10 for inner)
        region:
          type: string
        ipAddress:
          type: string
        publicKey:
          type: string
        privateKey:
          type: string
        listenPort:
          type: integer
        status:
          type: string
          enum: [active, inactive, rotating, trapped]
        hasBeacon:
          type: boolean
        hasSpider:
          type: boolean
        hasWorm:
          type: boolean
        latencyMs:
          type: number
        lastSeen:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, name, layer, hopIndex, region, ipAddress, publicKey, listenPort, status, hasBeacon, hasSpider, hasWorm, latencyMs, createdAt]

    NodeList:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/Node"
        total:
          type: integer
        outerCount:
          type: integer
        innerCount:
          type: integer
      required: [nodes, total, outerCount, innerCount]

    CreateNodeBody:
      type: object
      properties:
        name:
          type: string
        layer:
          type: string
          enum: [outer, inner]
        region:
          type: string
        hasBeacon:
          type: boolean
        hasSpider:
          type: boolean
        hasWorm:
          type: boolean
      required: [name, layer, region]

    UpdateNodeBody:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [active, inactive]
        hasBeacon:
          type: boolean
        hasSpider:
          type: boolean
        hasWorm:
          type: boolean
        region:
          type: string

    NodeStats:
      type: object
      properties:
        totalNodes:
          type: integer
        activeNodes:
          type: integer
        outerNodes:
          type: integer
        innerNodes:
          type: integer
        avgLatencyMs:
          type: number
        totalTrafficGb:
          type: number
        rotationsToday:
          type: integer
        alertsToday:
          type: integer
      required: [totalNodes, activeNodes, outerNodes, innerNodes, avgLatencyMs, totalTrafficGb, rotationsToday, alertsToday]

    WireguardConfig:
      type: object
      properties:
        nodeId:
          type: integer
        configText:
          type: string
          description: Full WireGuard wg0.conf file content
        peers:
          type: array
          items:
            type: object
            properties:
              publicKey:
                type: string
              allowedIps:
                type: string
              endpoint:
                type: string
            required: [publicKey, allowedIps]
        routingTable:
          type: string
          description: ip rule / ip route commands for this hop
        iptablesRules:
          type: string
          description: iptables MASQUERADE rules for this hop
      required: [nodeId, configText, peers, routingTable, iptablesRules]

    BeaconAlert:
      type: object
      properties:
        id:
          type: integer
        nodeId:
          type: integer
        nodeName:
          type: string
        nodeLayer:
          type: string
        attackerIp:
          type: string
        attackerFingerprint:
          type: string
        probeType:
          type: string
          enum: [ping, port_scan, traceroute, packet_sniff, tunnel_probe]
        severity:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [active, dismissed]
        silkWebTrapped:
          type: boolean
        rawData:
          type: string
        detectedAt:
          type: string
          format: date-time
      required: [id, nodeId, nodeName, nodeLayer, attackerIp, attackerFingerprint, probeType, severity, status, silkWebTrapped, detectedAt]

    BeaconAlertList:
      type: object
      properties:
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/BeaconAlert"
        total:
          type: integer
        activeCount:
          type: integer
      required: [alerts, total, activeCount]

    TriggerBeaconBody:
      type: object
      properties:
        nodeId:
          type: integer
        simulatedIp:
          type: string
        probeType:
          type: string
          enum: [ping, port_scan, traceroute, packet_sniff, tunnel_probe]
      required: [nodeId, probeType]

    BeaconStats:
      type: object
      properties:
        totalAlerts:
          type: integer
        activeAlerts:
          type: integer
        trappedAttackers:
          type: integer
        alertsLast24h:
          type: integer
        topProbeType:
          type: string
        criticalAlerts:
          type: integer
      required: [totalAlerts, activeAlerts, trappedAttackers, alertsLast24h, topProbeType, criticalAlerts]

    SilkWeb:
      type: object
      properties:
        id:
          type: integer
        totalRoutes:
          type: integer
        deadEndRoutes:
          type: integer
        activeHighways:
          type: integer
        intersections:
          type: integer
        generationId:
          type: string
        routes:
          type: array
          items:
            $ref: "#/components/schemas/SilkRoute"
        lastCollapsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, totalRoutes, deadEndRoutes, activeHighways, intersections, generationId, routes, createdAt]

    SilkRoute:
      type: object
      properties:
        id:
          type: integer
        fromNodeId:
          type: integer
        toNodeId:
          type: integer
        routeType:
          type: string
          enum: [highway, dead_end, decoy, collapse_zone]
        isActive:
          type: boolean
      required: [id, fromNodeId, toNodeId, routeType, isActive]

    TrappedAttacker:
      type: object
      properties:
        id:
          type: integer
        ip:
          type: string
        fingerprint:
          type: string
        entryNodeId:
          type: integer
        loopCount:
          type: integer
        trappedAt:
          type: string
          format: date-time
        dataCollected:
          type: string
      required: [id, ip, fingerprint, entryNodeId, loopCount, trappedAt, dataCollected]

    TrappedAttackerList:
      type: object
      properties:
        attackers:
          type: array
          items:
            $ref: "#/components/schemas/TrappedAttacker"
        total:
          type: integer
      required: [attackers, total]

    TerminalExecBody:
      type: object
      properties:
        command:
          type: string
        shell:
          type: string
          enum: [bash, sh, cmd, powershell]
      required: [command]

    TerminalResult:
      type: object
      properties:
        command:
          type: string
        stdout:
          type: string
        stderr:
          type: string
        exitCode:
          type: integer
        executedAt:
          type: string
          format: date-time
      required: [command, stdout, stderr, exitCode, executedAt]

    SqlQueryBody:
      type: object
      properties:
        query:
          type: string
        limit:
          type: integer
      required: [query]

    SqlQueryResult:
      type: object
      properties:
        query:
          type: string
        rows:
          type: array
          items:
            type: object
        columns:
          type: array
          items:
            type: string
        rowCount:
          type: integer
        executionTimeMs:
          type: number
        error:
          type: string
      required: [query, rows, columns, rowCount, executionTimeMs]

    Connection:
      type: object
      properties:
        id:
          type: string
        localAddress:
          type: string
        remoteAddress:
          type: string
        protocol:
          type: string
          enum: [TCP, UDP, WireGuard]
        state:
          type: string
        process:
          type: string
        pid:
          type: integer
        nodeId:
          type: integer
      required: [id, localAddress, remoteAddress, protocol, state, process]

    ConnectionList:
      type: object
      properties:
        connections:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
        total:
          type: integer
      required: [connections, total]

    SystemStats:
      type: object
      properties:
        cpuPercent:
          type: number
        memoryPercent:
          type: number
        memoryUsedMb:
          type: number
        memoryTotalMb:
          type: number
        networkInMbps:
          type: number
        networkOutMbps:
          type: number
        uptime:
          type: string
        platform:
          type: string
        activeUsers:
          type: integer
        wireguardTunnels:
          type: integer
        externalIp:
          type: string
      required: [cpuPercent, memoryPercent, memoryUsedMb, memoryTotalMb, networkInMbps, networkOutMbps, uptime, platform, activeUsers, wireguardTunnels]

    FirewallRule:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        direction:
          type: string
          enum: [inbound, outbound, both]
        action:
          type: string
          enum: [allow, deny, drop, reject, masquerade, log]
        protocol:
          type: string
          enum: [tcp, udp, icmp, any]
        sourceIp:
          type: string
        sourcePort:
          type: string
        destIp:
          type: string
        destPort:
          type: string
        priority:
          type: integer
        enabled:
          type: boolean
        hitCount:
          type: integer
        description:
          type: string
        isIspMasquerade:
          type: boolean
          description: Whether this rule helps mask the ISP and local host IP
        createdAt:
          type: string
          format: date-time
      required: [id, name, direction, action, protocol, priority, enabled, hitCount, isIspMasquerade, createdAt]

    FirewallRuleList:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/FirewallRule"
        total:
          type: integer
        enabledCount:
          type: integer
      required: [rules, total, enabledCount]

    CreateFirewallRuleBody:
      type: object
      properties:
        name:
          type: string
        direction:
          type: string
          enum: [inbound, outbound, both]
        action:
          type: string
          enum: [allow, deny, drop, reject, masquerade, log]
        protocol:
          type: string
          enum: [tcp, udp, icmp, any]
        sourceIp:
          type: string
        sourcePort:
          type: string
        destIp:
          type: string
        destPort:
          type: string
        priority:
          type: integer
        description:
          type: string
        isIspMasquerade:
          type: boolean
      required: [name, direction, action, protocol]

    UpdateFirewallRuleBody:
      type: object
      properties:
        name:
          type: string
        direction:
          type: string
          enum: [inbound, outbound, both]
        action:
          type: string
          enum: [allow, deny, drop, reject, masquerade, log]
        protocol:
          type: string
          enum: [tcp, udp, icmp, any]
        sourceIp:
          type: string
        sourcePort:
          type: string
        destIp:
          type: string
        destPort:
          type: string
        priority:
          type: integer
        enabled:
          type: boolean
        description:
          type: string
        isIspMasquerade:
          type: boolean

    FirewallStatus:
      type: object
      properties:
        enabled:
          type: boolean
        mode:
          type: string
          enum: [stealth, strict, standard, learning]
        totalRules:
          type: integer
        enabledRules:
          type: integer
        blockedIps:
          type: integer
        packetsBlocked:
          type: integer
        packetsAllowed:
          type: integer
        ispMasqueradeActive:
          type: boolean
