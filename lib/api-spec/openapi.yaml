openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: GhostNet VPN Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: nodes
    description: VPN node management
  - name: beacons
    description: Beacon and intrusion detection
  - name: silkweb
    description: Silk web routing and trapping
  - name: wireguard
    description: WireGuard configuration
  - name: terminal
    description: Terminal execution
  - name: sql
    description: SQL query interface
  - name: monitor
    description: System monitoring
  - name: firewall
    description: Built-in firewall management
  - name: honeypot
    description: Multi-node honeypot defense infrastructure

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /nodes:
    get:
      operationId: listNodes
      tags: [nodes]
      summary: List all VPN nodes
      parameters:
        - name: layer
          in: query
          schema:
            type: string
            enum: [outer, inner, all]
          description: Filter by layer (outer=50 ghost nodes, inner=10 core nodes)
      responses:
        "200":
          description: List of nodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeList"
    post:
      operationId: createNode
      tags: [nodes]
      summary: Create a new VPN node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNodeBody"
      responses:
        "201":
          description: Node created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"

  /nodes/{id}:
    get:
      operationId: getNode
      tags: [nodes]
      summary: Get node by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Node details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
    put:
      operationId: updateNode
      tags: [nodes]
      summary: Update a node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNodeBody"
      responses:
        "200":
          description: Updated node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
    delete:
      operationId: deleteNode
      tags: [nodes]
      summary: Delete a node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /nodes/{id}/config:
    get:
      operationId: getNodeWireguardConfig
      tags: [wireguard]
      summary: Get WireGuard config for a node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: WireGuard config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireguardConfig"

  /nodes/{id}/rotate-ip:
    post:
      operationId: rotateNodeIp
      tags: [nodes]
      summary: Rotate the IP address of a node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: New IP assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"

  /nodes/stats/summary:
    get:
      operationId: getNodeStats
      tags: [nodes]
      summary: Get node network summary stats
      responses:
        "200":
          description: Node statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeStats"

  /beacons:
    get:
      operationId: listBeaconAlerts
      tags: [beacons]
      summary: List all beacon intrusion alerts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, dismissed, all]
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeaconAlertList"

  /beacons/{id}/dismiss:
    post:
      operationId: dismissBeaconAlert
      tags: [beacons]
      summary: Dismiss a beacon alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alert dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeaconAlert"

  /beacons/trigger:
    post:
      operationId: triggerBeacon
      tags: [beacons]
      summary: Manually trigger a beacon test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerBeaconBody"
      responses:
        "201":
          description: Beacon triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeaconAlert"

  /beacons/stats:
    get:
      operationId: getBeaconStats
      tags: [beacons]
      summary: Get beacon detection statistics
      responses:
        "200":
          description: Beacon stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeaconStats"

  /silkweb:
    get:
      operationId: getSilkWeb
      tags: [silkweb]
      summary: Get silk web topology and dead-end routes
      responses:
        "200":
          description: Silk web topology
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SilkWeb"

  /silkweb/collapse:
    post:
      operationId: collapseSilkWeb
      tags: [silkweb]
      summary: Collapse and regenerate silk web routes to trap attackers
      responses:
        "200":
          description: Web collapsed and regenerated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SilkWeb"

  /silkweb/trapped:
    get:
      operationId: listTrappedAttackers
      tags: [silkweb]
      summary: List attackers currently trapped in the silk web
      responses:
        "200":
          description: Trapped attackers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrappedAttackerList"

  /terminal/exec:
    post:
      operationId: execTerminalCommand
      tags: [terminal]
      summary: Execute a terminal command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalExecBody"
      responses:
        "200":
          description: Command output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalResult"

  /sql/query:
    post:
      operationId: executeSqlQuery
      tags: [sql]
      summary: Execute a SQL query against the VPN database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SqlQueryBody"
      responses:
        "200":
          description: Query results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SqlQueryResult"

  /monitor/connections:
    get:
      operationId: getActiveConnections
      tags: [monitor]
      summary: Get all active network connections
      responses:
        "200":
          description: Active connections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionList"

  /monitor/stats:
    get:
      operationId: getSystemStats
      tags: [monitor]
      summary: Get system and network statistics
      responses:
        "200":
          description: System stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStats"

  /firewall/rules:
    get:
      operationId: listFirewallRules
      tags: [firewall]
      summary: List all firewall rules
      responses:
        "200":
          description: List of firewall rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirewallRuleList"
    post:
      operationId: createFirewallRule
      tags: [firewall]
      summary: Create a new firewall rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFirewallRuleBody"
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirewallRule"

  /firewall/rules/{id}:
    put:
      operationId: updateFirewallRule
      tags: [firewall]
      summary: Update a firewall rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFirewallRuleBody"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirewallRule"
    delete:
      operationId: deleteFirewallRule
      tags: [firewall]
      summary: Delete a firewall rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /firewall/status:
    get:
      operationId: getFirewallStatus
      tags: [firewall]
      summary: Get firewall status and statistics
      responses:
        "200":
          description: Firewall status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirewallStatus"

  /firewall/toggle:
    post:
      operationId: toggleFirewall
      tags: [firewall]
      summary: Enable or disable the firewall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleFirewallBody"
      responses:
        "200":
          description: Firewall toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirewallStatus"

  /firewall/blocked-ips:
    get:
      operationId: listBlockedIps
      tags: [firewall]
      summary: List currently blocked IP addresses
      responses:
        "200":
          description: Blocked IPs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedIpList"
    post:
      operationId: blockIp
      tags: [firewall]
      summary: Manually block an IP address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockIpBody"
      responses:
        "201":
          description: IP blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedIp"

  /firewall/blocked-ips/{id}/unblock:
    post:
      operationId: unblockIp
      tags: [firewall]
      summary: Unblock an IP address
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: IP unblocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedIp"

  /firewall/generate-iptables:
    post:
      operationId: generateIptablesRules
      tags: [firewall]
      summary: Generate iptables/nftables ruleset for export
      responses:
        "200":
          description: Generated rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IptablesExport"

  /firewall/ghostos/rules:
    get:
      operationId: listGhostOsRules
      tags: [firewall]
      summary: List all GhostOS SymScript rules
      responses:
        "200":
          description: GhostOS rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GhostOsRuleList"
    post:
      operationId: createGhostOsRule
      tags: [firewall]
      summary: Create a GhostOS SymScript rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGhostOsRuleBody"
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GhostOsRule"

  /firewall/ghostos/rules/{id}:
    put:
      operationId: updateGhostOsRule
      tags: [firewall]
      summary: Update a GhostOS rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbolicRule:
                  type: string
                description:
                  type: string
                enabled:
                  type: boolean
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GhostOsRule"
    delete:
      operationId: deleteGhostOsRule
      tags: [firewall]
      summary: Delete a GhostOS rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /firewall/ghostos/transcribe:
    post:
      operationId: transcribeToSymscript
      tags: [firewall]
      summary: Transcribe plain English or iptables to GhostOS SymScript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscribeBody"
      responses:
        "200":
          description: Transcription result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeResult"

  /firewall/ghostos/parse:
    post:
      operationId: parseGhostOsRule
      tags: [firewall]
      summary: Parse and explain a SymScript rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rule:
                  type: string
              required: [rule]
      responses:
        "200":
          description: Parse result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeResult"

  /firewall/ghostos/spec:
    get:
      operationId: getGhostOsSpec
      tags: [firewall]
      summary: Get the full GhostOS SymScript language specification
      responses:
        "200":
          description: SymScript spec
          content:
            application/json:
              schema:
                type: object

  /firewall/ghostos/transcriber-log:
    get:
      operationId: listTranscriberLog
      tags: [firewall]
      summary: List transcriber history
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema:
                type: object

  /firewall/ips/signatures:
    get:
      operationId: listIpsSignatures
      tags: [firewall]
      summary: List all IPS signatures
      responses:
        "200":
          description: IPS signatures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpsSignatureList"

  /firewall/ips/signatures/{id}/toggle:
    post:
      operationId: toggleIpsSignature
      tags: [firewall]
      summary: Enable or disable an IPS signature
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
              required: [enabled]
      responses:
        "200":
          description: Updated signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpsSignature"

  /firewall/ips/bulk-toggle:
    post:
      operationId: bulkToggleIpsCategory
      tags: [firewall]
      summary: Enable or disable all signatures in a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkToggleBody"
      responses:
        "200":
          description: Bulk update result
          content:
            application/json:
              schema:
                type: object

  /firewall/ips/signatures/{id}:
    delete:
      operationId: deleteIpsSignature
      tags: [firewall]
      summary: Delete a custom IPS signature
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /firewall/dpi/rules:
    get:
      operationId: listDpiRules
      tags: [firewall]
      summary: List DPI content inspection rules
      responses:
        "200":
          description: DPI rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DpiRuleList"
    post:
      operationId: createDpiRule
      tags: [firewall]
      summary: Create a DPI rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDpiRuleBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DpiRule"

  /firewall/dpi/rules/{id}:
    put:
      operationId: updateDpiRule
      tags: [firewall]
      summary: Update a DPI rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                action:
                  type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DpiRule"
    delete:
      operationId: deleteDpiRule
      tags: [firewall]
      summary: Delete a DPI rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /firewall/dpi/test:
    post:
      operationId: testDpiPattern
      tags: [firewall]
      summary: Test a DPI pattern against sample input
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pattern:
                  type: string
                patternType:
                  type: string
                testInput:
                  type: string
              required: [pattern, patternType, testInput]
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                type: object

  /firewall/geo:
    get:
      operationId: listGeoBlocks
      tags: [firewall]
      summary: List geo-IP blocks
      responses:
        "200":
          description: Geo blocks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoBlockList"
    post:
      operationId: addGeoBlock
      tags: [firewall]
      summary: Add a country-level geo-IP block
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGeoBlockBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoBlock"

  /firewall/geo/{id}:
    put:
      operationId: updateGeoBlock
      tags: [firewall]
      summary: Enable or disable a geo block
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
              required: [enabled]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoBlock"
    delete:
      operationId: removeGeoBlock
      tags: [firewall]
      summary: Remove a geo-IP block
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /firewall/threat-feeds:
    get:
      operationId: listThreatFeeds
      tags: [firewall]
      summary: List threat intelligence feeds
      responses:
        "200":
          description: Threat feeds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreatFeedList"

  /firewall/threat-feeds/{id}:
    put:
      operationId: updateThreatFeed
      tags: [firewall]
      summary: Enable or disable a threat feed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                autoSync:
                  type: boolean
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreatFeed"

  /firewall/threat-feeds/{id}/sync:
    post:
      operationId: syncThreatFeed
      tags: [firewall]
      summary: Manually sync a threat feed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                type: object

  /firewall/zones:
    get:
      operationId: listFirewallZones
      tags: [firewall]
      summary: List security zones
      responses:
        "200":
          description: Zones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirewallZoneList"
    post:
      operationId: createFirewallZone
      tags: [firewall]
      summary: Create a security zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateZoneBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirewallZone"

  /firewall/zones/{id}:
    put:
      operationId: updateFirewallZone
      tags: [firewall]
      summary: Update zone policy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inboundPolicy:
                  type: string
                outboundPolicy:
                  type: string
                trustLevel:
                  type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirewallZone"
    delete:
      operationId: deleteFirewallZone
      tags: [firewall]
      summary: Delete a security zone
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /firewall/fqdn-rules:
    get:
      operationId: listFqdnRules
      tags: [firewall]
      summary: List FQDN/domain-based firewall rules
      responses:
        "200":
          description: FQDN rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FqdnRuleList"
    post:
      operationId: createFqdnRule
      tags: [firewall]
      summary: Create a domain-based rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFqdnRuleBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FqdnRule"

  /firewall/fqdn-rules/{id}:
    put:
      operationId: updateFqdnRule
      tags: [firewall]
      summary: Toggle or update an FQDN rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                action:
                  type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FqdnRule"
    delete:
      operationId: deleteFqdnRule
      tags: [firewall]
      summary: Delete an FQDN rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /firewall/analytics:
    get:
      operationId: getFirewallAnalytics
      tags: [firewall]
      summary: Get firewall analytics, top blocked IPs, and IPS breakdown
      responses:
        "200":
          description: Analytics data
          content:
