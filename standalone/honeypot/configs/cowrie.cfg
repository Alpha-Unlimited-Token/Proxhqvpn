[honeypot]
hostname = honeypot
log_path = var/log
download_path = ${honeypot:state_path}/downloads
share_path = share/cowrie
state_path = var/lib/cowrie
etc_path = etc

[output_proxhq]
enabled = true
# Relay agent handles shipping — Cowrie just writes JSON logs
class = cowrie.output.jsonlog.Output

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
version_string = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6
rsa_public_key = ${honeypot:state_path}/ssh_host_rsa_key.pub
rsa_private_key = ${honeypot:state_path}/ssh_host_rsa_key
dsa_public_key = ${honeypot:state_path}/ssh_host_dsa_key.pub
dsa_private_key = ${honeypot:state_path}/ssh_host_dsa_key
ecdsa_public_key = ${honeypot:state_path}/ssh_host_ecdsa_key.pub
ecdsa_private_key = ${honeypot:state_path}/ssh_host_ecdsa_key

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[backend]
backend = shell

[shell]
filesystem = ${honeypot:share_path}/fs.pickle
data_path = ${honeypot:share_path}/data/
url_blocklist = ${honeypot:share_path}/data/blocklist

[download]
enabled = true
verify_url_suffix = false
pool = 10
