# WireGuard configuration template for honeypot nodes
# Copyright © 2026 Alpha Unlimited Technologies LLC
#
# This template connects the honeypot node to the ProxhqVPN inner mesh
# so relay agent traffic to the API server is encrypted and isolated.
#
# USAGE:
#   1. Generate a node keypair:
#        wg genkey | tee /dev/shm/hp-privkey | wg pubkey > /dev/shm/hp-pubkey
#   2. Register the public key with the ProxhqVPN API (/api/wireguard)
#   3. Fill in the placeholders below and install:
#        sudo install -m 600 wireguard-honeypot.conf /etc/wireguard/proxhq-hp.conf
#        sudo systemctl enable --now wg-quick@proxhq-hp
#
# SECURITY NOTE: Keep private key in /dev/shm (RAM only) — never on disk at rest.

[Interface]
# Honeypot node private key — store in /dev/shm/hp-privkey (RAM only)
PrivateKey = <HONEYPOT_NODE_PRIVATE_KEY>

# IP address assigned to this node within the inner mesh (10.200.x.x/24)
Address = <INNER_MESH_IP>/32

# DNS — use ProxhqVPN inner resolver to avoid leaks
DNS = 10.200.0.1

# Optional: restrict to UDP port for firewall rule matching
ListenPort = 51820

# Kill switch — drop all traffic if WireGuard tunnel goes down
PostUp   = iptables -I OUTPUT ! -o %i -m mark ! --mark $(wg show %i fwmark) -m addrtype ! --dst-type LOCAL -j REJECT
PreDown  = iptables -D OUTPUT ! -o %i -m mark ! --mark $(wg show %i fwmark) -m addrtype ! --dst-type LOCAL -j REJECT

# Allow Cowrie inbound even when tunnel is active (loopback)
PostUp   = iptables -A INPUT -p tcp --dport 2222 -j ACCEPT
PostUp   = iptables -A INPUT -p tcp --dport 2223 -j ACCEPT
PreDown  = iptables -D INPUT -p tcp --dport 2222 -j ACCEPT
PreDown  = iptables -D INPUT -p tcp --dport 2223 -j ACCEPT

[Peer]
# ProxhqVPN inner mesh gateway public key
PublicKey = <PROXHQVPN_GATEWAY_PUBLIC_KEY>

# Optional pre-shared key for post-quantum resistance (generated via `wg genpsk`)
PresharedKey = <PSK_OPTIONAL>

# ProxhqVPN API server endpoint
Endpoint = <PROXHQVPN_ENDPOINT_IP>:51820

# Only tunnel traffic destined for the inner mesh and the API server
# Keeps attacker SSH sessions going through the honeypot directly (not WireGuard)
AllowedIPs = 10.200.0.0/16

# Keepalive to maintain NAT mappings for the relay agent connection
PersistentKeepalive = 25
