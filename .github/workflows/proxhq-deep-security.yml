name: ProxHQ Deep Security Gates
on:
  pull_request:
  push:
    branches: [main]

jobs:
  deep-security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate API clients
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Typecheck (all packages)
        run: pnpm -w run typecheck

      - name: Fail on disabled TLS verification in Python daemons
        run: '! grep -RInE "CERT_NONE|check_hostname\s*=\s*False" tools/ standalone/'

      - name: Fail if PSK embedded in setup scripts
        run: '! grep -RIn "PSK=\"\${psk}\"" artifacts/api-server/src/'

      - name: Fail if security lab force-enabled in config
        run: '! grep -rn "PROXHQ_ENABLE_SECURITY_LAB=1" .env* || true'

      - name: Route inventory (informational)
        run: python3 scripts/route_inventory.py artifacts/api-server/src 2>&1 | tail -5

      - name: Import health check
        run: python3 scripts/import_health_check.py . 2>&1
