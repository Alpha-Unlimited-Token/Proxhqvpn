name: security-build-test
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-test-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        run: pnpm run typecheck

      - name: Fail on disabled TLS verification in production daemons
        run: |
          ! grep -Rn "CERT_NONE\|check_hostname *= *False\|verify *= *False" \
            tools artifacts standalone lib \
            --include="*.py" --include="*.ts" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=dist \
            --exclude='*test*' --exclude='*verifier*' --exclude='*spec*'

      - name: Fail on hardcoded secrets or SSH keys in source
        run: |
          ! grep -Rn \
            "ssh-ed25519 AAAA\|ssh-rsa AAAA\|DAEMON_PSK=[A-Za-z0-9]\{16,\}\|PRIVATE_KEY=[A-Za-z0-9]\{16,\}" \
            artifacts standalone tools lib \
            --include="*.ts" --include="*.js" --include="*.py" --include="*.sh" \
            --exclude-dir=node_modules --exclude-dir=dist

      - name: Verify WireGuard route requires device trust
        run: |
          grep -n "requireDeviceTrust" artifacts/api-server/src/routes/index.ts | grep wireguard
          grep -q "requireDeviceTrust" artifacts/api-server/src/middlewares/requireDeviceTrust.ts

      - name: Verify security lab routes are gated
        run: |
          grep -n "PROXHQ_ENABLE_SECURITY_LAB" artifacts/api-server/src/app.ts | grep SECURITY_LAB_ENABLED
